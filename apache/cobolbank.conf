# COBOLBank - Apache virtual host configuration
# COBOL CGI programs served directly — no Node.js layer

ServerName cobolbank.local

<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Static files (HTML/CSS/JS frontend)
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # COBOL CGI programs — ScriptAlias makes Apache treat everything here as CGI
    ScriptAlias /cgi-bin/ /app/cobol/cgi-bin/

    <Directory /app/cobol/cgi-bin>
        Options +ExecCGI
        SetHandler cgi-script
        Require all granted
    </Directory>

    # Database and env vars passed to every CGI process
    SetEnv COBOLGOAT_DB      /app/database/cobolgoat.db
    # GnuCOBOL finds sql-exec.so / json-get.so / url-param.so here
    SetEnv COB_LIBRARY_PATH  /app/cobol/lib

    # CORS — open to all origins (intentional vulnerability)
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Cookie"

    RewriteEngine On

    # Pre-flight OPTIONS — return 200 immediately
    RewriteCond %{REQUEST_METHOD} ^OPTIONS$
    RewriteRule ^ - [R=200,L]

    # ── /api/* → /cgi-bin/* ────────────────────────────────────────────────
    RewriteRule ^/api/auth/login$            /cgi-bin/login [PT,L]
    RewriteRule ^/api/auth/logout$           /cgi-bin/login [PT,L]
    RewriteRule ^/api/products/search$       /cgi-bin/search [PT,QSA,L]
    RewriteRule ^/api/reports/generate$      /cgi-bin/report-gen [PT,QSA,L]
    RewriteRule ^/api/admin/action$          /cgi-bin/admin-check [PT,QSA,L]
    RewriteRule ^/api/config$                /cgi-bin/config-reader [PT,L]
    RewriteRule ^/api/session(.*)$           /cgi-bin/session-check [PT,QSA,L]
    RewriteRule ^/api/files/read$            /cgi-bin/file-read [PT,QSA,L]

    # Debug — append type as query param
    RewriteRule ^/api/debug/env$             /cgi-bin/debug?type=env [PT,QSA,L]
    RewriteRule ^/api/debug/logs$            /cgi-bin/debug?type=logs [PT,QSA,L]
    RewriteRule ^/api/debug$                 /cgi-bin/debug [PT,QSA,L]

    # /api/accounts/* — specific sub-paths before generic account lookup
    RewriteRule ^/api/accounts/transfer$     /cgi-bin/transfer [PT,QSA,L]
    RewriteRule ^/api/accounts/interest$     /cgi-bin/interest-calc [PT,QSA,L]
    RewriteRule ^/api/accounts/([^/?]+)(.*)$ /cgi-bin/account-lookup?id=$1 [PT,QSA,L]

    ErrorLog  /tmp/cobol-goat/apache-error.log
    CustomLog /tmp/cobol-goat/apache-access.log combined
</VirtualHost>
